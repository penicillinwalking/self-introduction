<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歩くペニシリン | 自己紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="profile-page">
    <section class="profile-card" aria-labelledby="profile-name">
      <div class="photo-frame" aria-label="プロフィール写真の差し替え枠">
        <div class="photo-placeholder">
          <img src="onigiriman.png" alt="歩くペニシリンのプロフィール写真">
        </div>
      </div>

      <div class="profile-content">
        <p class="label">Self Introduction</p>
        <h1 id="profile-name">歩くペニシリン</h1>
        <p class="job">薬局経営者</p>

        <div class="hobby-list" aria-label="趣味">
          <span>AI</span>
          <span>NFT</span>
          <span>投資</span>
        </div>

        <p class="introduction">
          薬局経営を通じて、地域の人々が安心して相談できる場所づくりを大切にしています。
          医療や健康の知識を土台にしながら、AI、NFT、投資など新しい分野にも関心を広げ、
          これからの時代に合った学びと挑戦を続けています。日々の仕事では一人ひとりの声に耳を傾け、
          小さな不安にも丁寧に向き合うことを心がけています。人とのつながりを大切にしながら、
          やさしく実用的なアイデアを形にしていくことが目標です。
        </p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
